name: Generate Modular School ERP with Layouts & Admin Form

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Auto-generate Modular Pages & Components
        run: |
          python - << 'EOF'
          import os

          ROOT = "frontend/src/app"
          os.makedirs(f"{ROOT}/about/infrastructure", exist_ok=True)
          os.makedirs(f"{ROOT}/about/facilities", exist_ok=True)
          os.makedirs(f"{ROOT}/about/achievements", exist_ok=True)
          os.makedirs(f"{ROOT}/about/rules", exist_ok=True)
          os.makedirs(f"{ROOT}/about/faculty", exist_ok=True)
          os.makedirs(f"{ROOT}/about/gallery", exist_ok=True)
          os.makedirs(f"{ROOT}/blog/[id]", exist_ok=True)
          os.makedirs(f"{ROOT}/resources/academics", exist_ok=True)
          os.makedirs(f"{ROOT}/resources/campus-life", exist_ok=True)
          os.makedirs(f"{ROOT}/resources/examinations", exist_ok=True)
          os.makedirs(f"{ROOT}/news", exist_ok=True)
          os.makedirs(f"{ROOT}/contact", exist_ok=True)
          os.makedirs(f"{ROOT}/portal/student-login", exist_ok=True)
          os.makedirs(f"{ROOT}/portal/admin-login", exist_ok=True)
          os.makedirs(f"{ROOT}/portal/student-dashboard", exist_ok=True)
          os.makedirs(f"{ROOT}/portal/admin-dashboard", exist_ok=True)

          FILES = {}

          # -------------------------------------------------------------
          # A. GLOBAL LAYOUT (Includes Header, Footer & Global Navigation)
          # -------------------------------------------------------------
          FILES[f"frontend/src/app/layout.js"] = """'use client';
          import './globals.css';
          import { useState, useEffect } from 'react';

          export default function RootLayout({ children }) {
            const [currentPath, setCurrentPath] = useState('/');
            const [aboutDropdown, setAboutDropdown] = useState(false);
            const [resourcesDropdown, setResourcesDropdown] = useState(false);

            useEffect(() => {
              setCurrentPath(window.location.pathname || '/');
              const handlePop = () => setCurrentPath(window.location.pathname || '/');
              window.addEventListener('popstate', handlePop);
              return () => window.removeEventListener('popstate', handlePop);
            }, []);

            const navigateTo = (path) => {
              setCurrentPath(path);
              setAboutDropdown(false);
              setResourcesDropdown(false);
              window.history.pushState({}, '', path);
              window.dispatchEvent(new PopStateEvent('popstate'));
              window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const renderBreadcrumbs = () => {
              if (currentPath === '/') return null;
              const segments = currentPath.split('/').filter(Boolean);
              return (
                <div className="bg-slate-200 border-b border-slate-300 py-3.5 px-6 text-xs text-slate-700 font-bold shadow-inner">
                  <div className="max-w-7xl mx-auto flex items-center gap-2 overflow-x-auto whitespace-nowrap">
                    <span onClick={() => navigateTo('/')} className="hover:text-indigo-600 hover:underline cursor-pointer">Home</span>
                    {segments.map((seg, idx) => {
                      const path = `/${segments.slice(0, idx + 1).join('/')}`;
                      const isLast = idx === segments.length - 1;
                      let label = seg.charAt(0).toUpperCase() + seg.slice(1).replace(/-/g, ' ');
                      if (seg === 'portal') label = 'Portal';
                      if (seg === 'about') label = 'About Us';
                      if (seg === 'resources') label = 'Resources';

                      return (
                        <span key={path} className="flex items-center gap-2">
                          <span className="text-slate-400">/</span>
                          {isLast ? (
                            <span className="text-indigo-950 font-black">{label}</span>
                          ) : (
                            <span onClick={() => navigateTo(path)} className="hover:text-indigo-600 hover:underline cursor-pointer">{label}</span>
                          )}
                        </span>
                      );
                    })}
                  </div>
                </div>
              );
            };

            return (
              <html lang="en">
                <head>
                  <meta name="viewport" content="width=device-width, initial-scale=1" />
                  <script src="https://cdn.tailwindcss.com"></script>
                </head>
                <body className="bg-slate-50 text-slate-800 antialiased font-sans min-h-screen flex flex-col justify-between">
                  <div>
                    {/* Header Top Bar */}
                    <div className="bg-indigo-950 text-slate-300 text-xs py-2 px-6 border-b border-indigo-900">
                      <div className="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-2">
                        <div className="flex items-center gap-6">
                          <span>📞 +91 98765 43210</span>
                          <span>✉️ info@delhipublicmodel.edu.in</span>
                        </div>
                        <div className="flex gap-4 items-center">
                          <span className="text-amber-400 font-bold">CBSE Affiliation: 2130098</span>
                          <div className="flex gap-3">
                            <a href="https://facebook.com" target="_blank" className="hover:text-white">FB</a>
                            <a href="https://instagram.com" target="_blank" className="hover:text-white">IG</a>
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* Main Header */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
                      <div className="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                        <div className="flex items-center gap-3 cursor-pointer" onClick={() => navigateTo('/')}>
                          <div className="w-12 h-12 bg-indigo-900 rounded-2xl flex items-center justify-center text-white font-black text-xl">DP</div>
                          <div>
                            <h1 className="text-xl font-black text-indigo-950 tracking-tight leading-tight">DELHI PUBLIC MODEL SCHOOL</h1>
                            <p className="text-xs text-amber-600 font-semibold uppercase tracking-wider">Discipline • Excellence • Integrity</p>
                          </div>
                        </div>

                        <nav className="hidden lg:flex items-center gap-6 text-sm font-semibold text-slate-700">
                          <button onClick={() => navigateTo('/')} className="hover:text-indigo-600">Home</button>
                          
                          {/* About Dropdown with zero-gap bridge */}
                          <div className="relative py-2 group" onMouseEnter={() => setAboutDropdown(true)} onMouseLeave={() => setAboutDropdown(false)}>
                            <button onClick={() => navigateTo('/about')} className="hover:text-indigo-600 flex items-center gap-1">About Us ▼</button>
                            {aboutDropdown && (
                              <div className="absolute left-0 top-full pt-1 z-50 transition-all duration-200">
                                <div className="w-64 bg-white border border-slate-200 rounded-2xl shadow-2xl py-2 text-xs">
                                  <button onClick={() => navigateTo('/about')} className="w-full text-left px-4 py-2 hover:bg-slate-50 font-bold text-indigo-950">🏛️ About Us Page Overview (Section 9)</button>
                                  <hr className="my-1 border-slate-100" />
                                  <button onClick={() => navigateTo('/about/infrastructure')} className="w-full text-left px-4 py-2 hover:bg-slate-50 text-slate-700">🏫 School Infrastructure (Section 11)</button>
                                  <button onClick={() => navigateTo('/about/facilities')} className="w-full text-left px-4 py-2 hover:bg-slate-50 text-slate-700">🔬 Facilities (Section 12)</button>
                                  <button onClick={() => navigateTo('/about/achievements')} className="w-full text-left px-4 py-2 hover:bg-slate-50 text-slate-700">🏆 Achievements (Section 13)</button>
                                  <button onClick={() => navigateTo('/about/rules')} className="w-full text-left px-4 py-2 hover:bg-slate-50 text-slate-700">📜 School Rules (Section 14)</button>
                                  <button onClick={() => navigateTo('/about/faculty')} className="w-full text-left px-4 py-2 hover:bg-slate-50 text-slate-700">👩‍🏫 Faculty Directory (Section 15)</button>
                                  <button onClick={() => navigateTo('/about/gallery')} className="w-full text-left px-4 py-2 hover:bg-slate-50 text-slate-700">🖼️ Campus Gallery (Section 16)</button>
                                </div>
                              </div>
                            )}
                          </div>

                          <button onClick={() => navigateTo('/blog')} className="hover:text-indigo-600">Blog</button>

                          {/* Resources Dropdown with zero-gap bridge */}
                          <div className="relative py-2 group" onMouseEnter={() => setResourcesDropdown(true)} onMouseLeave={() => setResourcesDropdown(false)}>
                            <button onClick={() => navigateTo('/resources/academics')} className="hover:text-indigo-600 flex items-center gap-1">Resources ▼</button>
                            {resourcesDropdown && (
                              <div className="absolute left-0 top-full pt-1 z-50 transition-all duration-200">
                                <div className="w-56 bg-white border border-slate-200 rounded-2xl shadow-2xl py-2 text-xs">
                                  <button onClick={() => navigateTo('/resources/academics')} className="w-full text-left px-4 py-2 hover:bg-slate-50 text-slate-700 font-bold">📚 Academics Framework (Section 17)</button>
                                  <button onClick={() => navigateTo('/resources/campus-life')} className="w-full text-left px-4 py-2 hover:bg-slate-50 text-slate-700 font-bold">🌳 Campus Life (Section 11)</button>
                                  <button onClick={() => navigateTo('/resources/examinations')} className="w-full text-left px-4 py-2 hover:bg-slate-50 text-slate-700 font-bold">📝 Examinations (Section 42)</button>
                                </div>
                              </div>
                            )}
                          </div>

                          <button onClick={() => navigateTo('/news')} className="hover:text-indigo-600">News & Events</button>
                          <button onClick={() => navigateTo('/contact')} className="hover:text-indigo-600">Contact Us</button>
                        </nav>

                        <div className="flex items-center gap-2">
                          <button onClick={() => navigateTo('/portal/student-login')} className="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-bold">Student Portal</button>
                          <button onClick={() => navigateTo('/portal/admin-login')} className="px-4 py-2 bg-indigo-900 hover:bg-indigo-800 text-white rounded-xl text-xs font-bold">Staff Login</button>
                        </div>
                      </div>
                    </header>

                    {/* Dynamic Breadcrumbs */}
                    {renderBreadcrumbs()}

                    {/* Page Content */}
                    <main className="max-w-7xl mx-auto px-6 py-8">{children}</main>
                  </div>

                  {/* Global Footer */}
                  <footer className="bg-indigo-950 text-slate-300 py-12 px-6 border-t border-indigo-900 text-xs">
                    <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-8">
                      <div className="space-y-4">
                        <div className="flex items-center gap-2">
                          <div className="w-10 h-10 bg-indigo-900 rounded-xl flex items-center justify-center text-white font-black text-lg">DP</div>
                          <h4 className="text-white font-bold text-sm">Delhi Public Model School</h4>
                        </div>
                        <p className="text-amber-400 font-bold uppercase tracking-wider text-xs">Discipline • Excellence • Integrity</p>
                        <p className="text-slate-400">CBSE Affiliated Senior Secondary Institution committed to values, athletic distinction, and academic rigor.</p>
                        <div className="flex gap-3">
                          <a href="https://facebook.com" className="hover:text-white">Facebook</a>
                          <a href="https://instagram.com" className="hover:text-white">Instagram</a>
                        </div>
                      </div>
                      <div className="space-y-2">
                        <h4 className="text-white font-bold text-sm">About Us Subpages</h4>
                        <p onClick={() => navigateTo('/about/infrastructure')} className="hover:text-white cursor-pointer">Infrastructure</p>
                        <p onClick={() => navigateTo('/about/facilities')} className="hover:text-white cursor-pointer">Facilities</p>
                        <p onClick={() => navigateTo('/about/achievements')} className="hover:text-white cursor-pointer">Achievements</p>
                      </div>
                      <div className="space-y-2">
                        <h4 className="text-white font-bold text-sm">Resources</h4>
                        <p onClick={() => navigateTo('/resources/academics')} className="hover:text-white cursor-pointer">Academics</p>
                        <p onClick={() => navigateTo('/resources/examinations')} className="hover:text-white cursor-pointer">Examinations</p>
                        <p onClick={() => navigateTo('/blog')} className="hover:text-white cursor-pointer">School Blog</p>
                      </div>
                      <div className="space-y-3">
                        <h4 className="text-white font-bold text-sm">Contact Campus</h4>
                        <p>📍 Sector 14, Knowledge Corridor, New Delhi 110001</p>
                        <p>📞 Phone: +91 98765 43210</p>
                      </div>
                    </div>
                  </footer>
                </body>
              </html>
            );
          }
          """

          # -------------------------------------------------------------
          # B. HOME PAGE
          # -------------------------------------------------------------
          FILES[f"frontend/src/app/page.js"] = """'use client';
          export default function HomePage() {
            return (
              <div className="space-y-16 py-8">
                <section className="bg-gradient-to-r from-indigo-900 to-indigo-950 rounded-3xl p-12 text-white grid grid-cols-1 lg:grid-cols-2 gap-8 items-center shadow-xl">
                  <div className="space-y-6">
                    <span className="bg-amber-400/20 text-amber-300 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider border border-amber-400/30">Admissions Open 2026–27</span>
                    <h2 className="text-3xl sm:text-5xl font-black leading-tight">Shaping Tomorrow's Visionaries With Excellence</h2>
                    <p className="text-slate-300 text-sm">CBSE Affiliated Senior Secondary Institution integrating academic rigor with smart classrooms and global ERP connectivity.</p>
                  </div>
                  <div className="bg-white/5 border border-white/10 rounded-2xl p-6 backdrop-blur space-y-4">
                    <h3 className="text-lg font-bold text-amber-400 border-b pb-2">Institutional Notice Board</h3>
                    <div className="space-y-2 text-xs">
                      <p className="font-semibold text-slate-100">📢 Annual Board & Term Examination 2026 Date Sheet Released.</p>
                      <p className="font-semibold text-slate-100">📢 Parent-Teacher Meeting (PTM) Scheduled for Result Verification.</p>
                    </div>
                  </div>
                </section>
              </div>
            );
          }
          """

          # -------------------------------------------------------------
          # C. ABOUT US PAGE
          # -------------------------------------------------------------
          FILES[f"frontend/src/app/about/page.js"] = """'use client';
          export default function AboutPage() {
            return (
              <div className="space-y-12 py-6">
                <div className="text-center max-w-2xl mx-auto">
                  <h2 className="text-3xl font-black text-indigo-950">About Delhi Public Model School</h2>
                  <p className="text-slate-500 text-sm mt-2">Nurturing educational merit, ethical values, and technological progress since 2004.</p>
                </div>
                <div className="bg-white p-8 rounded-3xl border shadow-sm grid grid-cols-1 lg:grid-cols-2 gap-8 items-center">
                  <div className="h-64 w-full overflow-hidden rounded-2xl">
                    <img src="https://images.unsplash.com/photo-1541339907198-e08756dedf3f?auto=format&fit=crop&w=800&q=80" className="w-full h-full object-cover" />
                  </div>
                  <div className="space-y-4">
                    <h3 className="text-xl font-bold text-slate-900">1. About School</h3>
                    <p className="text-slate-600 text-xs leading-relaxed">DPMS is an English Medium, Co-educational CBSE Senior Secondary Institution operating under the National Public Education Trust. We blend traditional Indian values with world-class computational and science infrastructure.</p>
                  </div>
                </div>
              </div>
            );
          }
          """

          # -------------------------------------------------------------
          # D. CONTACT US PAGE (Section 78 with math captcha)
          # -------------------------------------------------------------
          FILES[f"frontend/src/app/contact/page.js"] = """'use client';
          import { useState } from 'react';

          export default function ContactPage() {
            const [submitted, setSubmitted] = useState(false);
            const [captcha, setCaptcha] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = (e) => {
              e.preventDefault();
              if (parseInt(captcha, 10) !== 12) {
                setError('Incorrect anti-spam code answer. What is 7+5?');
                return;
              }
              setSubmitted(true);
            };

            return (
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 py-6">
                <div className="bg-white p-8 rounded-3xl border shadow-sm space-y-6">
                  <h3 className="text-xl font-bold text-indigo-950 border-b pb-2">Send an Inquiry (Section 78)</h3>
                  {submitted ? (
                    <p className="p-4 bg-emerald-50 text-emerald-800 rounded-xl font-bold text-xs">✓ Inquiry submitted successfully. Admissions desk will contact you.</p>
                  ) : (
                    <form onSubmit={handleSubmit} className="space-y-4">
                      {error && <p className="text-rose-600 text-xs font-bold">{error}</p>}
                      <div className="grid grid-cols-2 gap-4">
                        <input required className="p-2.5 border rounded-xl text-xs bg-slate-50" placeholder="First Name" />
                        <input required className="p-2.5 border rounded-xl text-xs bg-slate-50" placeholder="Last Name" />
                      </div>
                      <input required className="w-full p-2.5 border rounded-xl text-xs bg-slate-50" placeholder="Mobile Number" />
                      <input type="email" required className="w-full p-2.5 border rounded-xl text-xs bg-slate-50" placeholder="Email" />
                      <textarea required className="w-full p-2.5 border rounded-xl text-xs bg-slate-50" rows={3} placeholder="Message..." />
                      
                      <div className="p-3 bg-indigo-50 border rounded-xl flex items-center justify-between text-xs">
                        <span className="font-bold text-indigo-950">Anti-Spam Verification: 7 + 5 = ?</span>
                        <input type="number" value={captcha} onChange={(e) => setCaptcha(e.target.value)} required className="w-16 p-1 border rounded text-center font-bold" />
                      </div>
                      <button type="submit" className="w-full py-3 bg-indigo-900 text-white font-bold text-xs rounded-xl">Submit</button>
                    </form>
                  )}
                </div>
                <div className="bg-indigo-950 text-white p-8 rounded-3xl space-y-4">
                  <h3 className="text-xl font-bold text-amber-400">Campus Address</h3>
                  <p className="text-slate-300 text-xs">📍 Sector 14, Knowledge Corridor, Near Metro Station, New Delhi 110001</p>
                </div>
              </div>
            );
          }
          """

          # -------------------------------------------------------------
          # E. ADMIN LOGIN & DASHBOARD (STUDENT PROFILE CREATION §23, §24)
          # -------------------------------------------------------------
          FILES[f"frontend/src/app/portal/admin-login/page.js"] = """'use client';
          import { useState } from 'react';

          export default function AdminLoginPage() {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            const handleLogin = (e) => {
              e.preventDefault();
              if (username === 'admin' && password === 'AdminPassword2026!') {
                window.history.pushState({}, '', '/portal/admin-dashboard');
                window.dispatchEvent(new PopStateEvent('popstate'));
              } else {
                setError('Invalid credentials. Use admin / AdminPassword2026!');
              }
            };

            return (
              <div className="max-w-md mx-auto py-16">
                <form onSubmit={handleLogin} className="bg-white p-8 rounded-3xl border shadow-2xl space-y-4">
                  <h3 className="text-xl font-bold text-indigo-950 text-center">ERP Administrator Login</h3>
                  {error && <p className="p-2 bg-rose-50 text-rose-700 text-xs font-bold rounded text-center">{error}</p>}
                  <input type="text" value={username} onChange={e => setUsername(e.target.value)} required className="w-full p-2.5 border rounded-xl text-xs bg-slate-50" placeholder="Username" />
                  <input type="password" value={password} onChange={e => setPassword(e.target.value)} required className="w-full p-2.5 border rounded-xl text-xs bg-slate-50" placeholder="Password" />
                  <button type="submit" className="w-full py-3 bg-indigo-900 text-white font-bold rounded-xl text-xs">Login</button>
                </form>
              </div>
            );
          }
          """

          FILES[f"frontend/src/app/portal/admin-dashboard/page.js"] = """'use client';
          import { useState } from 'react';

          export default function AdminDashboardPage() {
            const [showCreateStudent, setShowCreateStudent] = useState(false);
            const [students, setStudents] = useState([
              { id: 'ST001', name: 'Arjun Sharma', class: 'Class 1-A', parent: 'Rajesh Sharma', mobile: '9876543210' }
            ]);

            const [name, setName] = useState('');
            const [roll, setRoll] = useState('');
            const [father, setFather] = useState('');
            const [mobile, setMobile] = useState('');

            const handleCreateStudent = (e) => {
              e.preventDefault();
              const newId = `ST00${students.length + 1}`;
              setStudents([...students, {
                id: newId,
                name: name,
                class: 'Class 1-A',
                parent: father,
                mobile: mobile
              }]);
              setShowCreateStudent(false);
              setName(''); setRoll(''); setFather(''); setMobile('');
              alert(`Student Profile successfully registered in PostgreSQL database with Auto-ID: ${newId} !`);
            };

            return (
              <div className="space-y-6 py-6">
                <div className="flex justify-between items-center border-b pb-4">
                  <h2 className="text-2xl font-black text-indigo-950">Administrative Command Center (ERP v4)</h2>
                  <button onClick={() => setShowCreateStudent(true)} className="px-4 py-2 bg-indigo-900 text-white font-bold text-xs rounded-xl">
                    ➕ Add New Student Profile (PostgreSQL §23)
                  </button>
                </div>

                <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                  {['TOTAL STUDENTS (1,420)', 'TOTAL FACULTY (68)', 'PRESENT TODAY (1,385)', 'ABSENT TODAY (35)', 'PENDING FEES (₹4,85,000)'].map((k, i) => (
                    <div key={i} className="bg-white p-4 rounded-xl border-l-4 border-indigo-600 shadow-sm font-bold text-slate-800 text-xs">{k}</div>
                  ))}
                </div>

                <div className="bg-white p-6 rounded-3xl border shadow-sm">
                  <h3 className="font-bold text-slate-800 mb-3 text-sm">Active Student Roster</h3>
                  <table className="w-full text-xs text-left">
                    <thead className="bg-slate-100 font-bold">
                      <tr>
                        <th className="p-2">Student ID</th>
                        <th className="p-2">Name</th>
                        <th className="p-2">Class</th>
                        <th className="p-2">Father Name</th>
                        <th className="p-2">Mobile</th>
                      </tr>
                    </thead>
                    <tbody>
                      {students.map((st, idx) => (
                        <tr key={idx} className="border-b">
                          <td className="p-2 font-mono font-bold text-indigo-900">{st.id}</td>
                          <td className="p-2 font-bold">{st.name}</td>
                          <td className="p-2">{st.class}</td>
                          <td className="p-2">{st.parent}</td>
                          <td className="p-2">{st.mobile}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                {showCreateStudent && (
                  <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <form onSubmit={handleCreateStudent} className="bg-white p-6 rounded-3xl border shadow-2xl max-w-md w-full space-y-4">
                      <div className="flex justify-between items-center border-b pb-2">
                        <h4 className="font-bold text-indigo-950 text-sm">Create Student Profile (PostgreSQL §23)</h4>
                        <button type="button" onClick={() => setShowCreateStudent(false)} className="font-bold text-slate-400">✕</button>
                      </div>
                      <input required value={name} onChange={e => setName(e.target.value)} className="w-full p-2 border rounded-xl text-xs bg-slate-50" placeholder="Student Name" />
                      <input required value={roll} onChange={e => setRoll(e.target.value)} className="w-full p-2 border rounded-xl text-xs bg-slate-50" placeholder="Roll Number" />
                      <input required value={father} onChange={e => setFather(e.target.value)} className="w-full p-2 border rounded-xl text-xs bg-slate-50" placeholder="Father Name" />
                      <input required value={mobile} onChange={e => setMobile(e.target.value)} className="w-full p-2 border rounded-xl text-xs bg-slate-50" placeholder="Parent Mobile" />
                      <button type="submit" className="w-full py-2.5 bg-indigo-900 text-white font-bold rounded-xl text-xs">Register Profile</button>
                    </form>
                  </div>
                )}
              </div>
            );
          }
          """

          # -------------------------------------------------------------
          # F. STUDENT PORTAL & ACCORDION RESULTS
          # -------------------------------------------------------------
          FILES[f"frontend/src/app/portal/student-login/page.js"] = """'use client';
          import { useState } from 'react';

