          DATABASES = {
              'default': {
                  'ENGINE': 'django.db.backends.postgresql',
                  'NAME': os.environ.get('DB_NAME', 'school_erp_db'),
                  'USER': os.environ.get('DB_USER', 'erp_admin'),
