
name: Generate Complete School ERP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install qrcode reportlab

      - name: Auto-generate All Project Files
        run: |
          python - << 'EOF'
          import os

          FILES = {}

          # Docker & Compose
          FILES['docker-compose.yml'] = """version: '3.8'
          services:
            db:
              image: postgres:16-alpine
              container_name: school_postgres
              restart: always
              environment:
                POSTGRES_DB: ${DB_NAME:-school_erp_db}
                POSTGRES_USER: ${DB_USER:-erp_admin}
                POSTGRES_PASSWORD: ${DB_PASSWORD:-SecureProductionPassword2026!}
              volumes:
                - postgres_data:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-erp_admin} -d ${DB_NAME:-school_erp_db}"]
                interval: 5s
                timeout: 5s
                retries: 5
              networks:
                - erp_network

            redis:
              image: redis:7-alpine
              container_name: school_redis
              restart: always
              command: redis-server --appendonly yes
              volumes:
                - redis_data:/data
              networks:
                - erp_network

            backend:
              build:
                context: ./backend
                dockerfile: Dockerfile
              container_name: school_backend
              restart: always
              command: >
                sh -c "python manage.py wait_for_db &&
                       python manage.py migrate &&
                       gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2"
              volumes:
                - ./backend:/app
                - static_volume:/app/staticfiles
                - media_volume:/app/media
              env_file:
                - .env
              depends_on:
                db:
                  condition: service_healthy
                redis:
                  condition: service_started
              networks:
                - erp_network

            frontend:
              build:
                context: ./frontend
                dockerfile: Dockerfile
              container_name: school_frontend
              restart: always
              env_file:
                - .env
              depends_on:
                - backend
              networks:
                - erp_network

            nginx:
              image: nginx:alpine
              container_name: school_proxy
              restart: always
              ports:
                - "80:80"
                - "443:443"
              volumes:
                - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
                - static_volume:/var/www/static:ro
                - media_volume:/var/www/media:ro
              depends_on:
                - backend
                - frontend
              networks:
                - erp_network

          volumes:
            postgres_data:
            redis_data:
            static_volume:
            media_volume:

          networks:
            erp_network:
              driver: bridge
          """

          # Nginx
          FILES['nginx/nginx.conf'] = """events { worker_connections 1024; }
          http {
              include /etc/nginx/mime.types;
              sendfile on;
              client_max_body_size 25M;
              upstream backend_upstream { server backend:8000; }
              upstream frontend_upstream { server frontend:3000; }
              server {
                  listen 80;
                  server_name _;
                  location /static/ { alias /var/www/static/; }
                  location /media/ { alias /var/www/media/; }
                  location ~ ^/(api|admin)/ {
                      proxy_pass http://backend_upstream;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  }
                  location / {
                      proxy_pass http://frontend_upstream;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                  }
              }
          }
          """

