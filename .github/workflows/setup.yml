          # Package inits for apps
          for a in ['core', 'accounts', 'academics', 'examinations', 'fees', 'notifications', 'ai_assistant']:
              FILES[f'backend/apps/{a}/__init__.py'] = ""
              FILES[f'backend/apps/{a}/apps.py'] = f"from django.apps import AppConfig\nclass {a.capitalize()}Config(AppConfig):\n    name = 'apps.{a}'\n"

          # Core Models & Commands
          FILES['backend/apps/core/models.py'] = """import uuid
          from django.db import models

          class Organization(models.Model):
              id = models.UUIDField(primary_key=True, default=uuid.uuid4, editable=False)
              name = models.CharField(max_length=255)
              created_at = models.DateTimeField(auto_now_add=True)

          class School(models.Model):
              id = models.UUIDField(primary_key=True, default=uuid.uuid4, editable=False)
              organization = models.ForeignKey(Organization, on_delete=models.CASCADE, related_name='schools')
              name = models.CharField(max_length=255)
              code = models.CharField(max_length=50, unique=True)
              logo_url = models.TextField(blank=True, null=True)
              contact_email = models.EmailField(blank=True, null=True)
              contact_phone = models.CharField(max_length=50, blank=True, null=True)
              is_active = models.BooleanField(default=True)
              created_at = models.DateTimeField(auto_now_add=True)

          class AcademicYear(models.Model):
              id = models.UUIDField(primary_key=True, default=uuid.uuid4, editable=False)
              school = models.ForeignKey(School, on_delete=models.CASCADE, related_name='academic_years')
