name: Generate Complete School ERP with Database

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install qrcode reportlab

      - name: Auto-generate Database & Project Files
        run: |
          python - << 'EOF'
          import os

          FILES = {}

          # ---------------------------------------------------------
          # 1. DATABASE SCHEMA & SEED SQL (Directly visible in Git)
          # ---------------------------------------------------------
          FILES['database/01_schema.sql'] = """-- SCHOOL MANAGEMENT SYSTEM ERP - MASTER POSTGRESQL SCHEMA
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

          -- ORGANIZATIONS & SCHOOLS (§19 Multi-School Isolation)
          CREATE TABLE IF NOT EXISTS organizations (
              id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
              name VARCHAR(255) NOT NULL,
              created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
          );

          CREATE TABLE IF NOT EXISTS schools (
              id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
              organization_id UUID REFERENCES organizations(id) ON DELETE CASCADE,
              name VARCHAR(255) NOT NULL,
              code VARCHAR(50) UNIQUE NOT NULL,
              logo_url TEXT,
              contact_email VARCHAR(255),
              contact_phone VARCHAR(50),
              is_active BOOLEAN DEFAULT TRUE,
              created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
          );

          CREATE TABLE IF NOT EXISTS academic_years (
              id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
              school_id UUID REFERENCES schools(id) ON DELETE CASCADE,
              name VARCHAR(20) NOT NULL,
              start_date DATE NOT NULL,
              end_date DATE NOT NULL,
              is_current BOOLEAN DEFAULT FALSE,
              UNIQUE(school_id, name)
          );

          -- ACADEMIC STRUCTURE (§17)
          CREATE TABLE IF NOT EXISTS school_classes (
              id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
              school_id UUID REFERENCES schools(id) ON DELETE CASCADE,
              name VARCHAR(50) NOT NULL,
              display_order INT DEFAULT 0,
              UNIQUE(school_id, name)
          );

          CREATE TABLE IF NOT EXISTS class_sections (
              id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
              school_class_id UUID REFERENCES school_classes(id) ON DELETE CASCADE,
              name VARCHAR(10) NOT NULL,
              UNIQUE(school_class_id, name)
          );

          -- USERS & ROLES (§21, §91)
          CREATE TABLE IF NOT EXISTS users (
              id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
              username VARCHAR(150) UNIQUE NOT NULL,
              password_hash VARCHAR(255) NOT NULL,
              email VARCHAR(255),
              mobile VARCHAR(20),
              role VARCHAR(30) NOT NULL,
              school_id UUID REFERENCES schools(id) ON DELETE SET NULL,
              is_active BOOLEAN DEFAULT TRUE,
              created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
          );

          -- STUDENTS & ENROLLMENT (§21, §26)
          CREATE TABLE IF NOT EXISTS students (
              id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
              user_id UUID UNIQUE REFERENCES users(id) ON DELETE SET NULL,
              school_id UUID REFERENCES schools(id) ON DELETE CASCADE,
              admission_number VARCHAR(100) NOT NULL,
              student_id_code VARCHAR(100) NOT NULL,
              first_name VARCHAR(100) NOT NULL,
              last_name VARCHAR(100) NOT NULL,
              date_of_birth DATE NOT NULL,
              gender VARCHAR(10) NOT NULL,
              father_name VARCHAR(150),
              mother_name VARCHAR(150),
              aadhaar_number VARCHAR(12) DEFAULT NULL,
              created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
              UNIQUE(school_id, admission_number),
              UNIQUE(school_id, student_id_code)
          );

          CREATE TABLE IF NOT EXISTS student_enrollments (
              id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
              student_id UUID REFERENCES students(id) ON DELETE CASCADE,
              academic_year_id UUID REFERENCES academic_years(id) ON DELETE CASCADE,
              section_id UUID REFERENCES class_sections(id) ON DELETE CASCADE,
              roll_number INT,
              status VARCHAR(20) DEFAULT 'ACTIVE',
              UNIQUE(student_id, academic_year_id)
          );

          -- ATTENDANCE & LOCK WORKFLOW (§32, §35)
          CREATE TABLE IF NOT EXISTS daily_attendance (
              id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
              school_id UUID REFERENCES schools(id) ON DELETE CASCADE,
              section_id UUID REFERENCES class_sections(id) ON DELETE CASCADE,
              attendance_date DATE NOT NULL,
              is_locked BOOLEAN DEFAULT FALSE,
              locked_by UUID REFERENCES users(id),
              locked_at TIMESTAMP WITH TIME ZONE,
              UNIQUE(section_id, attendance_date)
          );

          CREATE TABLE IF NOT EXISTS student_attendance_records (
              id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
              daily_attendance_id UUID REFERENCES daily_attendance(id) ON DELETE CASCADE,
              student_id UUID REFERENCES students(id) ON DELETE CASCADE,
              status VARCHAR(10) NOT NULL CHECK (status IN ('PRESENT', 'ABSENT', 'LATE', 'LEAVE')),
              remarks TEXT,
              UNIQUE(daily_attendance_id, student_id)
          );

          -- EXAMINATIONS & AB STATUS (§36, §42, §43)
          CREATE TABLE IF NOT EXISTS examinations (
              id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
              school_id UUID REFERENCES schools(id) ON DELETE CASCADE,
              academic_year_id UUID REFERENCES academic_years(id) ON DELETE CASCADE,
              name VARCHAR(100) NOT NULL,
              is_published BOOLEAN DEFAULT FALSE,
              published_at TIMESTAMP WITH TIME ZONE
          );

          CREATE TABLE IF NOT EXISTS exam_results (
              id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
              examination_id UUID REFERENCES examinations(id) ON DELETE CASCADE,
              student_id UUID REFERENCES students(id) ON DELETE CASCADE,
              subject_name VARCHAR(100) NOT NULL,
              max_marks NUMERIC(5,2) NOT NULL,
              obtained_marks NUMERIC(5,2),
              is_absent BOOLEAN DEFAULT FALSE,
              grade VARCHAR(5),
              remarks TEXT,
              UNIQUE(examination_id, student_id, subject_name)
          );

          -- FINANCIAL LEDGER & PAYMENTS (§52, §59, §61)
          CREATE TABLE IF NOT EXISTS fee_structures (
              id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
              school_id UUID REFERENCES schools(id) ON DELETE CASCADE,
              name VARCHAR(100) NOT NULL,
              amount NUMERIC(10,2) NOT NULL,
              due_day INT DEFAULT 10
          );

          CREATE TABLE IF NOT EXISTS fee_ledger (
              id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
              student_id UUID REFERENCES students(id) ON DELETE CASCADE,
              school_id UUID REFERENCES schools(id) ON DELETE CASCADE,
              fee_type VARCHAR(100) NOT NULL,
              period_label VARCHAR(50) NOT NULL,
              due_date DATE NOT NULL,
              due_amount NUMERIC(10,2) NOT NULL,
              paid_amount NUMERIC(10,2) DEFAULT 0.00,
              remaining_amount NUMERIC(10,2) NOT NULL,
              status VARCHAR(20) DEFAULT 'PENDING' CHECK (status IN ('PENDING', 'PARTIAL', 'PAID', 'OVERDUE')),
              created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
          );

          CREATE TABLE IF NOT EXISTS payment_orders (
              id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
              student_id UUID REFERENCES students(id) ON DELETE CASCADE,
              gateway_order_id VARCHAR(150) UNIQUE NOT NULL,
              payable_amount NUMERIC(10,2) NOT NULL,
              status VARCHAR(20) DEFAULT 'CREATED' CHECK (status IN ('CREATED', 'PAID', 'FAILED', 'EXPIRED')),
              created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
          );

          CREATE TABLE IF NOT EXISTS payment_transactions (
              id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
              order_id UUID REFERENCES payment_orders(id) ON DELETE CASCADE,
              gateway_transaction_id VARCHAR(150) UNIQUE NOT NULL,
              amount NUMERIC(10,2) NOT NULL,
              status VARCHAR(20) NOT NULL,
              payment_method VARCHAR(50),
              created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
          );

          CREATE TABLE IF NOT EXISTS fee_receipts (
              id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
              receipt_number VARCHAR(100) UNIQUE NOT NULL,
              transaction_id UUID REFERENCES payment_transactions(id) ON DELETE CASCADE,
              student_id UUID REFERENCES students(id) ON DELETE CASCADE,
              pdf_file_url TEXT,
              created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
          );
          """

          FILES['database/02_seed_data.sql'] = """-- SEED BASELINE DATA (Auto-executed by PostgreSQL on initial container boot)
          DO $$
          DECLARE
              v_org_id UUID;
              v_school_id UUID;
              v_ay_id UUID;
              v_c1_id UUID;
              v_sec_a_id UUID;
              v_student_id UUID;
          BEGIN
              -- 1. Trust & School
              INSERT INTO organizations (name) VALUES ('National Education Trust')
              ON CONFLICT DO NOTHING;
              SELECT id INTO v_org_id FROM organizations WHERE name = 'National Education Trust' LIMIT 1;

              INSERT INTO schools (organization_id, name, code, contact_email, contact_phone)
              VALUES (v_org_id, 'Delhi Public Model School', 'DPS001', 'info@delhipublic.edu', '+91 9876543210')
              ON CONFLICT (code) DO NOTHING;
              SELECT id INTO v_school_id FROM schools WHERE code = 'DPS001' LIMIT 1;

              -- 2. Academic Year
              INSERT INTO academic_years (school_id, name, start_date, end_date, is_current)
              VALUES (v_school_id, '2026-27', '2026-04-01', '2027-03-31', TRUE)
              ON CONFLICT (school_id, name) DO NOTHING;
              SELECT id INTO v_ay_id FROM academic_years WHERE school_id = v_school_id AND name = '2026-27' LIMIT 1;

              -- 3. School Class & Section
              INSERT INTO school_classes (school_id, name, display_order)
              VALUES (v_school_id, 'Class 1', 5)
              ON CONFLICT (school_id, name) DO NOTHING;
              SELECT id INTO v_c1_id FROM school_classes WHERE school_id = v_school_id AND name = 'Class 1' LIMIT 1;

              INSERT INTO class_sections (school_class_id, name)
              VALUES (v_c1_id, 'A')
              ON CONFLICT (school_class_id, name) DO NOTHING;
              SELECT id INTO v_sec_a_id FROM class_sections WHERE school_class_id = v_c1_id AND name = 'A' LIMIT 1;

              -- 4. Demo Student
              INSERT INTO students (school_id, admission_number, student_id_code, first_name, last_name, date_of_birth, gender, father_name, mother_name)
              VALUES (v_school_id, 'ADM1024', 'ST001', 'Arjun', 'Sharma', '2018-05-15', 'MALE', 'Rajesh Sharma', 'Neha Sharma')
              ON CONFLICT (school_id, student_id_code) DO NOTHING;
              SELECT id INTO v_student_id FROM students WHERE school_id = v_school_id AND student_id_code = 'ST001' LIMIT 1;

              INSERT INTO student_enrollments (student_id, academic_year_id, section_id, roll_number)
              VALUES (v_student_id, v_ay_id, v_sec_a_id, 1)
              ON CONFLICT (student_id, academic_year_id) DO NOTHING;

              -- 5. Seed Pending Fee Ledger (§59 FIFO Demonstration)
              INSERT INTO fee_ledger (student_id, school_id, fee_type, period_label, due_date, due_amount, remaining_amount, status)
              VALUES 
                (v_student_id, v_school_id, 'Tuition Fee', 'March 2026', '2026-03-10', 1000.00, 1000.00, 'PENDING'),
                (v_student_id, v_school_id, 'Tuition Fee', 'April 2026', '2026-04-10', 1000.00, 1000.00, 'PENDING'),
                (v_student_id, v_school_id, 'Tuition Fee', 'May 2026', '2026-05-10', 1000.00, 1000.00, 'PENDING')
              ON CONFLICT DO NOTHING;
          END $$;
          """

          # ---------------------------------------------------------
          # 2. UPDATE DOCKER COMPOSE TO MOUNT DATABASE INITIALIZATION
          # ---------------------------------------------------------
          FILES['docker-compose.yml'] = """version: '3.8'

          services:
            db:
              image: postgres:16-alpine
              container_name: school_postgres
              restart: always
              environment:
                POSTGRES_DB: ${DB_NAME:-school_erp_db}
                POSTGRES_USER: ${DB_USER:-erp_admin}
                POSTGRES_PASSWORD: ${DB_PASSWORD:-SecureProductionPassword2026!}
              volumes:
                - postgres_data:/var/lib/postgresql/data
                - ./database:/docker-entrypoint-initdb.d:ro
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-erp_admin} -d ${DB_NAME:-school_erp_db}"]
                interval: 5s
                timeout: 5s
                retries: 5
              networks:
                - erp_network

            redis:
              image: redis:7-alpine
              container_name: school_redis
              restart: always
              networks:
                - erp_network

            backend:
              build:
                context: ./backend
                dockerfile: Dockerfile
              container_name: school_backend
              restart: always
              command: >
                sh -c "python manage.py wait_for_db &&
                       python manage.py migrate &&
                       gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4"
              volumes:
                - ./backend:/app
                - static_volume:/app/staticfiles
                - media_volume:/app/media
              env_file:
                - .env
              depends_on:
                db:
                  condition: service_healthy
                redis:
                  condition: service_started
              networks:
                - erp_network

            frontend:
              build:
                context: ./frontend
                dockerfile: Dockerfile
              container_name: school_frontend
              restart: always
              env_file:
                - .env
              depends_on:
                - backend
              networks:
                - erp_network

            nginx:
              image: nginx:alpine
              container_name: school_proxy
              restart: always
              ports:
                - "80:80"
                - "443:443"
              volumes:
                - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
                - static_volume:/var/www/static:ro
                - media_volume:/var/www/media:ro
              depends_on:
                - backend
                - frontend
              networks:
                - erp_network

          volumes:
            postgres_data:
            redis_data:
            static_volume:
            media_volume:

          networks:
            erp_network:
              driver: bridge
          """

          for path, content in FILES.items():
              d = os.path.dirname(path)
              if d and not os.path.exists(d):
                  os.makedirs(d, exist_ok=True)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)

          print("Generated Database schema and mounted to docker-compose successfully!")
          EOF

      - name: Commit and Push Database Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add visible database schemas, seed data, and docker auto-init" || exit 0
          git push origin main
